# Licence texts of the libraries that python-build-standalone 3.12.15+20261009 builds into the Python of the
# offline bundle (TECH-10, NG-N07, D-08, D-17). The install_only_stripped archives that
# packaging/bundle_lock.json pins carry only CPython's LICENSE.txt and pip's licence files. D-17 (2026-10-27):
# the texts of the other libraries are the licence files python-build-standalone keeps at the root of its
# repository at the release tag 20261009 (LICENSE.*.txt, which it copies into python/licenses/ of its full
# archives) and, for what that set lacks, the project files: itcl 4.3.8 and Tcl thread 3.0.6 (license.terms of
# the tcltk mirrors), the expat and libmpdec sections of CPython's Doc/license.rst at v3.12.15 (Windows builds
# them from CPython's own sources) and the licence header of HACL* in CPython's Modules/_hacl. Not the
# version-exact upstream files the URL list names as alternatives. Licence files are kept byte for byte; the
# extracts of Doc/license.rst (its sections) and of Hacl_Hash_SHA2.c (its leading comment) are verbatim, UTF-8
# with LF (kind 'document excerpt' and 'source header'), and their source_size and source_sha256 are those of
# the file they come from (tools/notices.py --sources checks them against a copy). tools/notices.py checks
# every SHA-256, that the pinned version has this review and that each licence is permissive
# (LIBRARY_ALLOWED), lists the libraries in section 4 of THIRD_PARTY_NOTICES.txt and copies the texts into
# section 6. Versions: pythonbuild/downloads.json at the tag 20261009 (commit ccc07c40), checked against the
# version strings of the binaries in the pinned archives (read without running anything); platform: where the
# library is built in. Not needed: Berkeley DB (the bundle leaves out _dbm), zstd and zlib-ng (from CPython
# 3.14 on), openssl-1.1.
version = 1
component = "python-build-standalone"
component_version = "3.12.15+20261009"
decision = "D-17"
retrieved = "2026-10-27"
downloads = "Each file once from raw.githubusercontent.com: 16 licence files of astral-sh/python-build-standalone at the tag 20261009, license.terms of tcltk/itcl at itcl-4-3-8 and of tcltk/thread at thread-3-0-6, Doc/license.rst and Modules/_hacl/Hacl_Hash_SHA2.c of python/cpython at v3.12.15. Not downloaded: the full archives of the release (98368568 bytes for Linux, 43744049 for Windows), which carry the same LICENSE.*.txt files."

