# Licence review of the documentation site (TECH-06, TECH-10, NG-N07, D-05, A-86): every third-party part of
# the site that tools/build_docs.py builds with mkdocs-material 9.7.7 (docs group of uv.lock) and that the
# offline bundle (docs/) and the release ship. Read on 2026-10-26 from the installed wheel
# mkdocs_material-9.7.7 (minified files, their source maps and licence files); nothing was downloaded.
#
# [[package]]: a part of the site with its reviewed licence (spdx), its stored texts ([[package.text]]: file
# below this folder, or repository_file of this repository) and, while a text or the licence itself could
# not be read from the shipped files, the known_missing.toml entry it waits for (pending). installed: the
# file of the installed distribution a licence file was copied from byte for byte; tools/build_docs.py
# checks that the installed theme still carries exactly that file. found: how the shipped files name the
# version ("in mkdocs-material@9.7.7": compiled into the theme's files, no own version recorded).
# [[site_file]]: a glob of a path of the built site (** spans folders) and the packages the file contains.
# tools/build_docs.py fails for a site file that neither NeuroGrid writes itself (OWN_SITE_FILES) nor an entry
# covers, for a package whose licence is not permissive (MPL-2.0 only with unmodified = true, D-05) and has
# no known_missing.toml entry, and for any file of pruned that is still there; tools/notices.py copies the
# review into THIRD_PARTY_NOTICES.txt and checks every SHA-256.
version = 1
theme = "mkdocs-material"
theme_version = "9.7.7"
retrieved = "2026-10-26"
# Removed by tools/build_docs.py after the build: the lunr language files (lunr-languages, MPL; tinyseg;
# wordcut), which the English-only search (mkdocs.yml search lang: en) never loads, and the source maps.
pruned = ["assets/javascripts/lunr/**", "**/*.map"]

