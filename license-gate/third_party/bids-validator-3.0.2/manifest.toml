note = "The source-map entries node-modules-polyfills:node:fs/promises and node-modules-polyfills:node:path are Node polyfills that esbuild inlined from @jspm/core/nodelibs/browser (buffer.js, fs.js, fs/promises.js, path.js, punycode.js, url.js and their chunks, among them the process shim); the bundle's 'Bundled license information' trailer lists these chunks under hed-validator/dist/esm/index.js. Inside are the buffer module of Feross Aboukhadijeh (@license MIT), ieee754 (BSD-3-Clause, Feross Aboukhadijeh), base64 code, punycode (its code names the versions 2.1.0 and 2.3.1), url and the process shim. D-17: the version 2.1.0 is named neither by the map nor by the trailer; it follows from the deno.lock of bids-validator at the tag 3.0.2 (esbuild-plugins-node-modules-polyfill 1.7.1 with @jspm/core 2.1.0), from the lockfile of hed-validator 4.2.0 (esbuild-plugins-node-modules-polyfill 1.8.1 with the same @jspm/core and integrity) and from the 19 content-hashed chunk names under node_modules/@jspm/core/nodelibs/browser in the map, all of which 2.1.0 has (ten are missing in 2.0.1). The sha512 integrity of the downloaded tarball starts as the one of the lockfiles (3sRl+pky). Its LICENSE (Apache-2.0 for @jspm/core, Copyright 2018-2021 Guy Bedford, and MIT sections for the Node libraries it ports) is kept byte for byte as the npm tarball carries it, with CRLF line endings; the GitHub file at the gitHead c0a60d6 has the same text with LF. That LICENSE does not cover every package inside the chunks, so the licence files of 33 further packages are attached (LICENSE.<package>@<version>.txt, each from its GitHub repository at the npm gitHead of the version, byte-equal to the file of the npm package): ieee754 and qs (BSD-3-Clause), memfs and fs-monkey (Unlicense, a public-domain dedication), inherits (ISC) and 28 under MIT. Their versions are only proven by the lockfile of jspm-core at the gitHead c0a60d6 of 2.1.0 (D-17: 'nur über Lockfile belegt'): they are the runtime closure there of buffer, memfs, url, util, readable-stream, events, string_decoder, process, path-browserify and punycode, an upper bound, as rollup rewrote the bundled code and no file can be compared byte for byte. Code features in the bundle show ieee754 (its @license comment in the trailer), base64-js (byteLength, toByteArray, fromByteArray), memfs (Volume, pathToFilename), qs (allowPrototypes, arrayLimit), side-channel with get-intrinsic and call-bind (GetIntrinsic, $gOPD, callBind), object-inspect (inspect_) and readable-stream (ReadableState, WritableState); the other helpers are part of the closure only."
