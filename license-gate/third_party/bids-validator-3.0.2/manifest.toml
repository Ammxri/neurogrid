# Licence texts of the npm and jsr packages compiled into the BIDS validator bundle (TECH-10, NG-N07, D-15).
# Package list: bids_validator_deno/bids-validator.js.map of bids_validator_deno-3.0.2-py3-none-any.whl; each
# package at exactly that version from registry.npmjs.org (version document + tarball, sha512 integrity
# checked) or jsr.io (<version>_meta.json + file, sha256 checksum checked), retrieved 2026-10-26. D-17
# (2026-10-27): a package whose version the source map does not name (nested in the prebuilt dist of
# hed-validator 4.2.0, the polyfills of @jspm/core) has the version its lockfile names, see its note, and its
# texts come from the package's repository at the npm gitHead of that version (raw.githubusercontent.com,
# byte-equal to the npm package's file where it has one) or, for @jspm/core, from its npm tarball; those texts
# carry retrieved and decision. kind 'document excerpt': the licence section of a web page as plain text
# (UTF-8, LF; the targets of its links in parentheses, its list numbers kept), with source_size and
# source_sha256 of the page as retrieved (tools/notices.py --sources checks them against a copy). Only the
# licence files (and licence headers of compiled sources) are kept, byte for byte for licence files; header
# extracts are UTF-8 with LF.
# tools/notices.py checks every SHA-256 and that the packages equal the source map, and copies the texts into
# THIRD_PARTY_NOTICES.txt. found: how the source map names the version. pending: the known_missing.toml entry
# for texts that are still missing. owner_decision: the known_missing.toml entry (with a decision) of a
# licence outside BUNDLED_ALLOWED (tools/notices.py). downloads: what was transferred to get the texts.
version = 1
validator = "bids-validator-deno"
validator_version = "3.0.2"
source_map = "bids_validator_deno/bids-validator.js.map"
decision = "D-15"
retrieved = "2026-10-26"
downloads = "registry.npmjs.org serves no single files: for each npm package the whole tarball (archive_url; about 8.4 MB in all, among them hed-validator 5.4 MB and isomorphic-git 1.2 MB; hash-wasm-4.12.0.tgz was fetched twice, with the same SHA-256) was downloaded only to extract its licence files and licence headers. Only those files are stored here; no tarball is kept. jsr.io served the single files. D-17 (2026-10-27): 45 single files, each fetched once: 43 from raw.githubusercontent.com (among them the LF LICENSE of @jspm/core at c0a60d6, fetched only to compare it with the one of the tarball and not kept), the Unicode License V3 from www.unicode.org and the page create.stephan-brumme.com/disclaimer.html (only its excerpt is kept); and the tarball of @jspm/core 2.1.0 (1521183 bytes), from which only its LICENSE was extracted; no tarball is kept."

