# Licence texts or licences that are known to be missing (TECH-10, A-56, A-86). Each entry needs a download that
# no decision of the owner covers (D-06, D-15, D-16, D-17), so it waits for the owner's decision at STOPP G1.
# The release workflow fails while this list is not empty: it runs `tools/notices.py --download --check`, and
# --check exits 1 for each entry. The notices and the REUSE test name each entry; license-gate/third_party/*/
# manifest.toml names the entry of a bundled package whose texts are still missing (pending).
# component: "<dist>:<pattern>" of license-gate/components.toml, or a name for texts outside the wheels.
# decision: set when the entry waits for the owner's decision on a licence (not only for a text);
# the manifest of a bundled package names such an entry as owner_decision.
#
# Empty since D-17 (2026-10-27): the texts of the eight entries of STOPP G1 (the packages nested in the
# prebuilt dist of hed-validator 4.2.0, the Brumme and argon2 parts of hash-wasm 4.12.0, @jspm/core 2.1.0,
# libaec and libsz of h5py, the libraries of python-build-standalone 3.12.15+20261009, focus-visible and
# material-design-color of the documentation site) were downloaded from the URL list the owner approved.
