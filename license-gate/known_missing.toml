# Licence texts or licences that are known to be missing (TECH-10, A-56, A-86). Each entry needs a download that
# neither D-06 nor D-15 covers, so it waits for the owner's decision at STOPP G1. The release workflow fails
# while this list is not empty: it runs `tools/notices.py --download --check`, and --check exits 1 for each
# entry. The notices and the REUSE test name each entry; license-gate/third_party/*/manifest.toml names the
# entry of a bundled package whose texts are still missing (pending).
# component: "<dist>:<pattern>" of license-gate/components.toml, or a name for texts outside the wheels.

[[missing]]
component = "bids-validator-deno:hed-validator@4.2.0/node_modules"
what = "Eight packages that the prebuilt dist of hed-validator 4.2.0 carries inside the BIDS validator 3.0.2 bundle (@nodable/entities, fast-xml-parser, lodash, path-expression-matcher, semver, strnum, unicode-name, xml-naming) have no version in the source map, so their licence files were not downloaded (D-15 covers exact versions only)."

[[missing]]
component = "bids-validator-deno:hash-wasm@4.12.0/src"
what = "hash-wasm 4.12.0 inside the BIDS validator bundle compiles C code whose headers carry no licence text: crc32, crc64, xxhash32 and xxhash64 (Stephan Brumme, 'All rights reserved') only refer to http://create.stephan-brumme.com/disclaimer.html, and argon2 is based on Go's implementation without its licence."

[[missing]]
component = "h5py:h5py.libs/libaec-*.so*"
what = "libaec 1.1.4 in the Linux h5py wheel: the wheel states neither its licence nor its text."

[[missing]]
component = "h5py:h5py.libs/libsz-*.so*"
what = "libsz (part of libaec 1.1.4) in the Linux h5py wheel: the wheel states neither its licence nor its text."

[[missing]]
component = "python-build-standalone:3.12.15+20261009"
what = "The licence texts of the libraries inside the python-build-standalone archive other than CPython (e.g. OpenSSL, libffi, SQLite, XZ, zlib) are not in the distributed install_only archive."
