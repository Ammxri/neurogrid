# --- Pillow (via matplotlib/MNE): libraries of the Linux wheel, licences from the wheel's SBOM -----------------
# The Windows wheel links these libraries statically into its extension modules. Pillow's SBOM also names
# libimagequant (GPL-3.0-or-later) and FriBiDi as optional: their symbols are absent from PIL/_imaging of both
# wheels (measured: no 'liq_image_quantize'), and FriBiDi is only loaded from the system at run time.

