# Reviewed components that are not plain Python code (D-08, A-56, NG-N07). One file for tools/notices.py
# (notices) and tools/licenses.py (static component check from the locked wheels of both targets).
#
# Fields: dist (wheel distribution or component name), pattern (glob of the file inside the wheel, or the part
# outside the wheels), platform (win_amd64 | linux_x86_64 | any), spdx (licence of the component), kind,
# notice (glob of the licence text inside the same wheel, or where the text is; "" if there is none), note.
# kind: native (native library or executable in a wheel), bundled (non-Python component in a wheel),
# notice (an extra notice file of a wheel that the notices copy), external (third-party file in this
# repository), bundle (part of the offline bundle outside the wheels), not_distributed (never shipped).
# Every native file of a delivered wheel needs an entry; an entry of a delivered wheel that matches nothing
# fails the check (stale review). Entries for packages that are not locked (yet) are inactive.
# Measured 2026-10-23 from the wheels of uv.lock (zipfile, nothing installed); licences are those the wheel
# itself states (licence blocks, SBOM, version strings); NOASSERTION entries are listed in known_missing.toml.

# Licences a native or bundled component may have (D-08: native libraries in wheels with notice).
native_allowed = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Open-MPI",
    "CC-BY-4.0",
    "FTL",
    "GPL-3.0-or-later WITH GCC-exception-3.1",  # GCC runtime libraries only, never plain GPL
    "IJG",
    "LGPL-2.1-or-later",  # libquadmath, dynamically linked (D-08)
    "LicenseRef-HDF5",
    "LicenseRef-Microsoft-VC-Redist",
    "MIT",
    "X11",
    "Zlib",
    "libpng-2.0",
    "libtiff",
]

# --- deno (runs the BIDS validator, A-06) -------------------------------------------------------------------

[[component]]
dist = "deno"
pattern = "deno-*.data/scripts/deno.exe"
platform = "win_amd64"
spdx = "MIT"
kind = "bundled"
notice = "deno-*.dist-info/licenses/LICENSE"
note = "Deno runtime binary of the PyPI package deno."

[[component]]
dist = "deno"
pattern = "deno-*.data/scripts/deno"
platform = "linux_x86_64"
spdx = "MIT"
kind = "bundled"
notice = "deno-*.dist-info/licenses/LICENSE"
note = "Deno runtime binary of the PyPI package deno."

# --- BIDS validator bundle ----------------------------------------------------------------------------------

[[component]]
dist = "bids-validator-deno"
pattern = "bids_validator_deno/bids-validator.js"
platform = "any"
spdx = "MIT"
kind = "bundled"
notice = "bids_validator_deno-*.dist-info/licenses/LICENSE"
note = "BIDS validator 3.0.2 as one JavaScript bundle; the npm and jsr packages compiled into it are listed in section 3. Their licence files are not in the wheel; they are kept in license-gate/third_party/bids-validator-3.0.2 (downloaded at the versions of the source map, D-15)."

[[component]]
dist = "bids-validator-deno"
pattern = "bids_validator_deno/bids-validator.js"
platform = "any"
spdx = "CC-BY-4.0"
kind = "bundled"
notice = "LICENSES/CC-BY-4.0.txt"
note = "HED schemas embedded in the bundle (standard schemas 8.0.0 to 8.4.0 and library schemas); their epilogue states Creative Commons Attribution 4.0 International, HED Working Group, DOI 10.5281/zenodo.7876037. The CC BY 4.0 legal code is LICENSES/CC-BY-4.0.txt."

[[component]]
dist = "bids-validator-deno"
pattern = "bids_validator_deno/*.js*"
platform = "any"
spdx = "CC-BY-4.0"
kind = "bundled"
notice = "license-gate/third_party/bids-validator-3.0.2/jsr/@bids/schema@1.2.7/LICENSE"
note = "BIDS schema 1.2.7 (jsr @bids/schema, BIDS 1.11.1) inside the bundle; the wheel states no licence for it, the LICENSE of the jsr package at that version is CC BY 4.0 (Copyright (c) 2018, BIDS Contributors; D-15)."

