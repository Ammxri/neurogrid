# --- outside the wheels -------------------------------------------------------------------------------------

[[component]]
dist = "Noto Sans SC"
pattern = "src/neurogrid/report/fonts/NotoSansSC-*.ttf"
platform = "any"
spdx = "OFL-1.1"
kind = "external"
notice = "src/neurogrid/report/fonts/OFL.txt"
note = "Static cuts 400 and 700 of the report font, built by tools/build_fonts.py from Google Fonts (A-27); also subset into the documentation site."

# Parts of the offline bundle outside the wheels: dist = component, pattern = the version pinned in
# packaging/bundle_lock.json (tools/notices.py reads the pinned archives; another version fails as unreviewed).

[[component]]
dist = "python-build-standalone"
pattern = "3.12.15+20261009"
platform = "any"
spdx = "Python-2.0"
kind = "bundle"
notice = "python/LICENSE.txt (Windows) and python/lib/python3.12/LICENSE.txt (Linux) in the archive"
note = "CPython 3.12.15, install_only_stripped. LICENSE.txt holds the PSF licence stack (PSF, BeOpen, CNRI, CWI) and the zero-clause BSD licence for code in the documentation; on Windows also the conditions for the Microsoft Distributable Code, bzip2 1.0.8 and Tcl/Tk. pip inside the archive brings its own licence files. The texts of the further libraries built into the interpreter (for example OpenSSL, libffi, SQLite, XZ, zlib) are not in the archive (known_missing.toml). On Linux the bundle leaves out _dbm (Berkeley DB, Sleepycat; packaging/bundle_lock.json)."

[[component]]
dist = "uv"
pattern = "0.13.0"
platform = "any"
spdx = "MIT OR Apache-2.0"
kind = "bundle"
notice = "uv-0.13.0.dist-info licence files of the PyPI wheel (uv/LICENSE-MIT and uv/LICENSE-APACHE in the bundle)"
note = "The uv binary from the PyPI wheel uv==0.13.0, which also carries the CycloneDX SBOM of its Rust crates (uv/uv.cyclonedx.json in the bundle)."

[[component]]
dist = "Chrome Headless Shell"
pattern = "revision 1243 (153.0.8010.12)"
platform = "any"
spdx = "LicenseRef-Google-Chrome-Terms"
kind = "not_distributed"
notice = ""
note = "Needed for PDF only. Never part of NeuroGrid or the offline bundle (D-08); the user installs it with tools/install_pdf_browser.py under Google's terms. Its LICENSE.headless_shell lists bundled open-source parts, among them FFmpeg (LGPL-2.1-or-later)."
