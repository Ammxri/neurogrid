# Reviewed components of the research project that are not plain Python code (research/neuroarena; D-08,
# A-108 after F10 B). Read by tools/licenses.py --target research --components with the reader of
# tools/notices.py: every native file of the locked runtime wheels of both research targets (CPython 3.12 on
# win_amd64 and on the ubuntu-24.04 runner of research.yml, manylinux up to 2_39) needs an entry; an entry that
# matches nothing in a locked wheel fails the check (stale review).
# Same fields as license-gate/components.toml: dist, pattern (glob inside the wheel), platform (win_amd64 |
# linux_x86_64 | any), spdx, kind (native | bundled), notice (glob of the licence text inside the same wheel,
# a text kept in this repository, or "" if there is none), note.
# The research part ships no binaries (F8 A: code, lock, notebook, report, figures, CSV), so a missing text in
# a wheel is noted, not a failure. A licence outside native_allowed (LGPL among them) passes only as a
# version-bound entry of license-gate/research/exceptions.toml.
# Measured 2026-11-02 from the wheels of research/neuroarena/uv.lock (zipfile, nothing installed); licences are
# those the wheel itself states (licence files, SBOM, version strings in the binaries).

# The native allowlist of the package gate (D-08) without LGPL-2.1-or-later (LGPL only version-bound, F10 B)
# and without CC-BY-4.0 (no such part here), plus permissive licences of torch's own expression
# (Apache-2.0 WITH LLVM-exception, BSL-1.0, ISC) and MPL-2.0 for an unmodified library (D-05, libzmq).
native_allowed = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Open-MPI",
    "BSL-1.0",
    "FTL",
    "GPL-3.0-or-later WITH GCC-exception-3.1",  # GCC runtime libraries only, never plain GPL (D-08)
    "IJG",
    "ISC",
    "LicenseRef-HDF5",
    "LicenseRef-Microsoft-VC-Redist",
    "MIT",
    "MPL-2.0",
    "X11",
    "Zlib",
    "libpng-2.0",
    "libtiff",
]

# --- torch 2.15.0 (CPU build of the PyTorch index, A-36) ----------------------------------------------------
# The wheel's License-Expression covers PyTorch and the third-party code built into its libraries (sleef,
# fmt, protobuf, oneDNN, XNNPACK, pthreadpool, cpuinfo, kineto, miniz, pocketfft and others; the texts are in
# torch-*.dist-info/licenses/third_party/).

[[component]]
dist = "torch"
pattern = "torch/lib/torch*.dll"
platform = "win_amd64"
spdx = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND ISC AND MIT AND Zlib"
kind = "native"
notice = "torch-*.dist-info/licenses/LICENSE"
note = "torch.dll, torch_cpu.dll, torch_global_deps.dll and torch_python.dll: PyTorch's own libraries with the third-party code built in."

