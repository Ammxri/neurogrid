# Version-bound, reviewed exceptions of the research gate (research/neuroarena; A-108 after F10 B, the owner's
# answer of 2026-11-02, recorded as D-20 at the end of P11). Read by tools/licenses.py --target research.
#
# [[package]]: a Python distribution outside license-gate/research/allowlist.txt. It is left out of the
# allowlist stage for exactly this version; an LGPL entry is also left out of the copyleft stage.
# [[component]]: a native or bundled part of a locked wheel (license-gate/research/components.toml) whose
# licence is not on the research native allowlist; it passes for exactly this wheel version, pattern and
# platform, and names the licence of its entry.
# Rules (checked by the tool): exact versions; GPL and AGPL are forbidden, also as an exception. Every entry
# names the decision that covers it: LGPL after F10 B, EPL-1.0 (debugpy) and the Intel OpenMP runtime (torch on
# Windows) after the owner's answer of 2026-11-02 (D-20); all only for dependencies used unmodified and never
# shipped (the research part ships code, lock, notebook, report, figures and CSV only, F8 A). Another version of
# a package fails the gate until it is reviewed again.
# status: accepted (covered by a decision) | pending (passes, printed by every gate run, waits for the
# owner's decision; to be settled with D-20).

version = 1

# --- Python distributions ---------------------------------------------------------------------------------

[[package]]
name = "pycountry"
version = "26.2.16"
licence = "LGPL-2.1-only"
status = "accepted"
decision = "F10 B (LGPL as a version-bound exception; pycountry named by the owner)"
reason = "Hard dependency of moabb 1.7.2 (requires pycountry>=24.6.1; country names of dataset metadata). Installed and imported unmodified as a library in the research environment; never copied, changed or shipped. Reviewed 2026-11-02."

[[package]]
name = "pybv"
version = "0.8.1"
licence = "BSD-3-Clause"
status = "accepted"
decision = "A-56 (the review of license-gate/exceptions.txt of the package gate, same version)"
reason = "Dependency of moabb 1.7.2. Its metadata field License holds the full BSD 3-Clause text, so no allowlist string can match; dist-info LICENSE is the BSD 3-Clause text (Copyright (c) 2018, pybv developers). Reviewed 2026-11-02."

# --- native and bundled parts of wheels -------------------------------------------------------------------

[[component]]
name = "soundfile"
version = "0.14.0"
pattern = "_soundfile_data/libsndfile_x64.dll"
platform = "win_amd64"
licence = "LGPL-2.1-or-later AND LGPL-2.0-or-later AND LGPL-2.1-only AND BSD-3-Clause"
status = "accepted"
decision = "F10 B (libsndfile named by the owner)"
reason = "libsndfile 1.2.2 (version string in the DLL) with libmp3lame (LGPL-2.0-or-later), libmpg123 (LGPL 2.1) and the BSD-3-Clause libraries FLAC, Ogg, Opus and Vorbis built in, as the wheel's licensing/license_notes.md states; the wheel carries the LGPL 2.1 text as _soundfile_data/COPYING. soundfile comes in through wfdb 4.3.1 (braindecode 1.8.1); NeuroArena reads no audio. Loaded unmodified as a shared library, never shipped. Reviewed 2026-11-02."

[[component]]
name = "soundfile"
version = "0.14.0"
pattern = "_soundfile_data/libsndfile_x86_64.so"
platform = "linux_x86_64"
licence = "LGPL-2.1-or-later AND LGPL-2.0-or-later AND LGPL-2.1-only AND BSD-3-Clause"
status = "accepted"
decision = "F10 B (libsndfile named by the owner)"
reason = "libsndfile 1.2.2 (version string in the library) with libmp3lame, libmpg123, FLAC, Ogg, Opus and Vorbis built in, as licensing/license_notes.md of the wheel states; LGPL 2.1 text as _soundfile_data/COPYING. Same use as on Windows. Reviewed 2026-11-02."

[[component]]
name = "numpy"
version = "2.5.4"
pattern = "numpy.libs/libquadmath-*.so*"
platform = "linux_x86_64"
licence = "LGPL-2.1-or-later"
status = "accepted"
decision = "D-08 (libquadmath, dynamically linked, as in the package gate) with F10 B (LGPL only version-bound)"
reason = "GCC's libquadmath, dynamically linked by OpenBLAS of the numpy wheel; block 'libquadmath' of numpy's LICENSE.txt. Loaded unmodified, never shipped. Reviewed 2026-11-02."

[[component]]
name = "scipy"
version = "1.18.1"
pattern = "scipy.libs/libquadmath-*.so*"
platform = "linux_x86_64"
licence = "LGPL-2.1-or-later"
status = "accepted"
decision = "D-08 (libquadmath, dynamically linked, as in the package gate) with F10 B (LGPL only version-bound)"
reason = "GCC's libquadmath in two builds, dynamically linked by the Fortran parts of the scipy wheel; block 'libquadmath' of scipy's LICENSE.txt. Loaded unmodified, never shipped. Reviewed 2026-11-02."

[[component]]
name = "torch"
version = "2.15.0+cpu"
pattern = "torch/lib/libiomp*.dll"
platform = "win_amd64"
licence = "NOASSERTION"
status = "accepted"
decision = "owner 2026-11-02 (D-20): version-bound exception for this wheel only, used locally and never shipped; the missing licence text is recorded here"
reason = "libiomp5md.dll and libiompstubs5md.dll of the Windows CPU wheel: Intel OpenMP runtime 5.0.20260828 built with Intel oneAPI DPC++/C++ 2024.2.0, 'Copyright (C) 1997-2025, Intel Corporation. All Rights Reserved.' in the DLLs. The wheel carries no licence text for them (its third_party/llvm-openmp text names the libomp of the macOS wheels only), so the licence is not stated: proprietary redistributable runtime, terms not verified. torch loads it unmodified for its CPU threads; never shipped. Found 2026-11-02."

[[component]]
name = "debugpy"
version = "1.8.22"
pattern = "debugpy/_vendored/pydevd/*"
platform = "any"
licence = "EPL-1.0"
status = "accepted"
decision = "owner 2026-11-02 (D-20): version-bound exception; EPL-1.0 is a weak copyleft outside D-05, D-08 and F10 B"
reason = "PyDev.Debugger vendored by debugpy (debugpy/ThirdPartyNotices.txt: Eclipse Public License 1.0), its Python code and its native attach helpers (attach_*.dll, inject_dll_*.exe, run_code_on_dllmain_*.dll, attach_linux_amd64.so); pip-licenses sees only debugpy's own MIT licence. debugpy is a hard dependency of ipykernel 7.4.0, which nbclient needs to run the notebook headless (F11 B); NeuroArena never starts the debugger. Used unmodified, never shipped. Found 2026-11-02."
