# NeuroGrid CI (TECH-05, NG-N04, NG-N07, NG-N08): lint, types and tests on Windows and Linux with Python 3.11-3.13,
# PDF tests included (NEUROGRID_REQUIRE_PDF=1: a missing PDF browser fails instead of skipping), the command line
# under Windows PowerShell 5.1 and PowerShell 7, coverage, licence and traceability gates. Runs on every push to dev
# and main and on pull requests; never uploads datasets (CON-02). The offline bundles, the clean rooms and the
# OS-level offline evidence run in offline.yml (every push to dev and main, D-15; manual start; for a tag through
# release.yml).
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  PYTHONWARNDEFAULTENCODING: "1"
  UV_PYTHON_DOWNLOADS: automatic
  NEUROGRID_REQUIRE_PDF: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install (locked, no source builds)
        run: uv sync --locked --no-build --python ${{ matrix.python }}
      - name: System libraries of the PDF browser (Linux, A-58; the list the start check uses)
        if: runner.os == 'Linux'
        run: |
          packages="$(uv run --no-sync python tools/linux_pdf_packages.py ubuntu24.04)"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $packages
      - name: PDF browser (Chrome Headless Shell 1243 into NeuroGrid's folder, pinned SHA-256; D-08)
        run: uv run --no-sync python tools/install_pdf_browser.py
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Types (strict for the kernel)
        run: |
          uv run --no-sync mypy --strict src/neurogrid/kernel
          uv run --no-sync mypy src/neurogrid tools
      - name: Tests with coverage
        run: >-
          uv run --no-sync pytest -q --cov=neurogrid --cov-report=json:coverage.json --cov-report=term
          --junitxml=pytest-junit.xml
      # On failure: the failed tests as error annotations of the check run, which the public API serves
      # without a login (TECH-05). GitHub keeps 10 error annotations per step: four steps annotate the
      # failed tests 1-40, a fifth the counts.
      - name: Failed tests 1-10 as annotations
        if: failure() && hashFiles('pytest-junit.xml') != ''
        run: uv run --no-sync python tools/junit_annotations.py pytest-junit.xml --offset 0 --limit 10
      - name: Failed tests 11-20 as annotations
        if: failure() && hashFiles('pytest-junit.xml') != ''
        run: uv run --no-sync python tools/junit_annotations.py pytest-junit.xml --offset 10 --limit 10
      - name: Failed tests 21-30 as annotations
        if: failure() && hashFiles('pytest-junit.xml') != ''
        run: uv run --no-sync python tools/junit_annotations.py pytest-junit.xml --offset 20 --limit 10
      - name: Failed tests 31-40 as annotations
        if: failure() && hashFiles('pytest-junit.xml') != ''
        run: uv run --no-sync python tools/junit_annotations.py pytest-junit.xml --offset 30 --limit 10
      - name: Test counts as an annotation
        if: failure() && hashFiles('pytest-junit.xml') != ''
        run: uv run --no-sync python tools/junit_annotations.py pytest-junit.xml --summary --limit 40
      - name: Coverage gates (Kern >= 90 %, Prüfer >= 80 %)
        run: uv run --no-sync python tools/coverage_gates.py coverage.json
      # On success: the counts as a notice annotation, so a green run's numbers are readable without a login.
      - name: Test counts of a green run as an annotation
        if: success()
        run: uv run --no-sync python tools/junit_annotations.py pytest-junit.xml --summary --limit 40
      - name: Determinism sample for cross-platform comparison
        run: uv run --no-sync neurogrid check tests/fixtures/synthetic/edf_mixed --config tests/fixtures/documented.toml --as-of 2026-10-11 --out results-${{ matrix.os }}-${{ matrix.python }}.json
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: results-${{ matrix.os }}-${{ matrix.python }}.json
          retention-days: 14

  compare:
    name: cross-platform comparison (reported, not enforced)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          merge-multiple: true
      - name: Compare results without the environment block
        run: |
          python3 - <<'EOF'
          import json, pathlib
          docs = {p.name: json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path("results").glob("*.json")}
          for d in docs.values():
              d.pop("environment", None)
          reference = next(iter(docs.values()))
          for name, doc in sorted(docs.items()):
              print(name, "identical" if doc == reference else "DIFFERS")
          EOF

  traceability:
    name: requirement IDs in commits and progress entries (TECH-12, A-43)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 tools/check_commit_ids.py

  licenses:
    name: licence gate and scan of the installed runtime packages (NG-N07, A-49)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --no-build --python 3.12
      - run: uv run --no-sync python tools/licenses.py
      - name: Network and telemetry scan of the runtime packages against the reviewed baseline
        run: uv run --no-sync python tools/scan_runtime_network.py

  powershell51:
    name: Windows PowerShell 5.1 command line
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --no-build --python 3.12
      - run: uv run --no-sync python tools/install_pdf_browser.py
      - name: check, report html and pdf, exit codes
        run: |
          .\.venv\Scripts\neurogrid.exe check tests\fixtures\synthetic\edf_ok --config tests\fixtures\documented.toml --out r.json
          if ($LASTEXITCODE -ne 0) { throw "expected exit 0, got $LASTEXITCODE" }
          .\.venv\Scripts\neurogrid.exe check tests\fixtures\synthetic\empty --out e.json
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          .\.venv\Scripts\neurogrid.exe report r.json --lang "zh,en" --format "html,pdf"
          if ($LASTEXITCODE -ne 0) { throw "report failed" }
          foreach ($f in 'report.zh.html', 'report.en.html', 'report.zh.pdf', 'report.en.pdf') {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }
          $global:LASTEXITCODE = 0

  pwsh:
    name: PowerShell 7 command line
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --no-build --python 3.12
      - run: uv run --no-sync python tools/install_pdf_browser.py
      - name: check, report html and pdf, exit codes, Chinese path with a space
        run: |
          $data = Join-Path $env:RUNNER_TEMP '数据 集'
          Copy-Item -Recurse tests\fixtures\synthetic\edf_ok $data
          .\.venv\Scripts\neurogrid.exe check $data --config tests\fixtures\documented.toml --out r.json
          if ($LASTEXITCODE -ne 0) { throw "expected exit 0, got $LASTEXITCODE" }
          .\.venv\Scripts\neurogrid.exe check tests\fixtures\synthetic\empty --out e.json
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1, got $LASTEXITCODE" }
          .\.venv\Scripts\neurogrid.exe report r.json --lang "zh,en" --format "html,pdf"
          if ($LASTEXITCODE -ne 0) { throw "report failed" }
          foreach ($f in 'report.zh.html', 'report.en.html', 'report.zh.pdf', 'report.en.pdf') {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }
          .\.venv\Scripts\neurogrid.exe check
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2 for a usage error, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
