# Release of a version (V-01, TECH-05, D-07, D-10 g). Runs only for a tag v* that the project owner pushes (or
# starts by hand on such a tag); never on branches. Builds wheel, sdist, documentation, notices and both offline
# bundles reproducibly, signs them keyless with Sigstore (no stored key), tests exactly the signed bundles in the
# clean rooms (offline.yml) and creates a DRAFT GitHub Release. Publishing the draft, PyPI (publish-pypi.yml) and
# the Gitee mirror (mirror-gitee.yml) stay with the owner. The gate fails while placeholders or missing licence
# texts remain.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.0"

jobs:
  build:
    name: gate, build and sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing through GitHub's OIDC token; no key, no secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Release gate (tag = version, on main, clean tree, no placeholders, licence texts complete)
        run: python3 tools/release_check.py --tag "$GITHUB_REF_NAME"
      - name: Lock file is current
        run: uv lock --check
      - name: Licence texts complete (fails while license-gate/known_missing.toml lists a gap, G1)
        run: |
          uv sync --locked --no-build --python 3.12
          uv run --no-sync python tools/licenses.py --release
      - name: Wheel, sdist, documentation, notices of both targets and both signed bundles (reproducible)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          version="${GITHUB_REF_NAME#v}"
          uv build --out-dir dist
          uv run --no-sync python tools/build_docs.py --site-dir site
          uv run --no-sync python tools/notices.py --download --check
          cp THIRD_PARTY_NOTICES.txt tools/install_pdf_browser.py dist/
          for platform in win_amd64 linux_x86_64; do
            uv run --no-sync python tools/bundle.py build --platform "$platform" \
              --wheel "dist/neurogrid-${version}-py3-none-any.whl" --sdist "dist/neurogrid-${version}.tar.gz" \
              --docs site --notices THIRD_PARTY_NOTICES.txt --out dist --sign sigstore
          done
          for archive in dist/neurogrid-*-offline-*; do
            uv run --no-sync python tools/bundle.py verify "$archive"
          done
      - name: Release checksums and their keyless signature (verified right away)
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cd dist
          sha256sum -- * | LC_ALL=C sort -k 2 > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --strict SHA256SUMS
      - name: Release notes from packaging/release-notes.md
        run: python3 tools/release_check.py --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 3

  test:
    name: clean rooms of exactly the signed bundles
    needs: build
    uses: ./.github/workflows/offline.yml
    with:
      artifact: release-dist

  draft:
    name: draft GitHub Release (the owner reviews and publishes it)
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create the draft release with every signed file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "NeuroGrid ${GITHUB_REF_NAME#v}" --notes-file notes/release-notes.md dist/*
