# PyPI upload (V-01, D-07: the project owner publishes with his own account; TestPyPI first, then PyPI). Started
# only by hand on a tag v*, after the owner has published the GitHub Release. Trusted Publishing (OIDC): no API
# token is stored. Uploads exactly the wheel and sdist of that release, after checking them against the signed
# release SHA256SUMS - nothing is rebuilt. The owner registers this workflow as trusted publisher on test.pypi.org
# and pypi.org and approves the "testpypi" / "pypi" environments.
name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "testpypi first, then pypi"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  fetch:
    name: wheel and sdist from the signed GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify (signature of SHA256SUMS, then exactly two checksum lines)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "neurogrid-${version}-py3-none-any.whl" --pattern "neurogrid-${version}.tar.gz" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
          cosign verify-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cd dist
          grep -E "  neurogrid-${version//./\\.}(-py3-none-any\.whl|\.tar\.gz)$" SHA256SUMS > wanted
          test "$(wc -l < wanted)" -eq 2
          sha256sum --check --strict wanted
          rm wanted SHA256SUMS SHA256SUMS.sigstore.json
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: dist/
          retention-days: 3

  publish:
    name: upload to ${{ inputs.repository }} (Trusted Publishing)
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write # Trusted Publishing; no token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (commit of the annotated tag)
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
