# NeuroGrid core rule pack (A-02). Clause = metric ID from the public metric documentation
# (docs/<lang>/metrics.md). Rule IDs follow CORE-Mxx-NN by design (documented exception to PACK-PHASE-NNN).
# Further metrics are added phase by phase (KONZEPT.md §2.2).
rulepack: core
version: "0.1.0"
source: "NeuroGrid core metrics (docs/metrics.md)"
source_status: final
norm: false
rules:
  - id: CORE-M01-01
    clause: M01
    title_zh: 数据文件可读取
    title_en: Data file can be read
    phase: storage
    check: structure.readable
    severity: error
    verification: automatic

  - id: CORE-M01-02
    clause: M01
    title_zh: 文件头一致
    title_en: File header is consistent
    phase: storage
    check: structure.header_consistent
    severity: error
    verification: automatic

  - id: CORE-M01-03
    clause: M01
    title_zh: 伴随文件和引用存在
    title_en: Companion files and references are present
    phase: storage
    check: structure.companions_present
    severity: error
    verification: automatic

  - id: CORE-M01-04
    clause: M01
    title_zh: 数据文件格式受支持
    title_en: Data file format is supported
    phase: storage
    check: structure.supported_format
    severity: error
    verification: automatic

  - id: CORE-M01-05
    clause: M01
    title_zh: 文件头不含个人标识或真实日期
    title_en: Header contains no person identifier or real date
    phase: storage
    check: structure.identifying_header
    severity: info
    verification: automatic

  - id: CORE-M02-01
    clause: M02
    title_zh: EEG-BIDS 必填字段已记录
    title_en: Required EEG-BIDS field is documented
    phase: acquisition
    check: metadata.required_fields
    severity: error
    verification: automatic

  - id: CORE-M02-02
    clause: M02
    title_zh: 元数据一致（TaskName、BIDSVersion、名称）
    title_en: Metadata are consistent (TaskName, BIDSVersion, Name)
    phase: acquisition
    check: metadata.consistent
    severity: warning
    verification: automatic

  - id: CORE-M03-01
    clause: M03
    title_zh: 采样率不低于最低值
    title_en: Sampling rate at or above the minimum
    phase: acquisition
    check: signal.sampling_rate_min
    params: {min_hz: 500}
    severity: warning
    verification: automatic

  - id: CORE-M03-02
    clause: M03
    title_zh: 采样率统一或已说明原因
    title_en: Sampling rates are uniform or the difference is documented
    phase: acquisition
    check: signal.sampling_rate_uniform
    severity: warning
    verification: automatic

  - id: CORE-M03-03
    clause: M03
    title_zh: 附带文件中的采样率与数据一致
    title_en: Sampling rate in the sidecar matches the data
    phase: acquisition
    check: signal.sidecar_rate
    severity: warning
    verification: automatic

  - id: CORE-M04-01
    clause: M04
    title_zh: 通道名符合 10-20/10-10 或已映射
    title_en: Channel names follow 10-20/10-10 or are mapped
    phase: acquisition
    check: channels.standard_names
    severity: error
    verification: automatic

  - id: CORE-M04-02
    clause: M04
    title_zh: 电极位置已记录
    title_en: Electrode positions are documented
    phase: acquisition
    check: channels.positions
    severity: warning
    verification: automatic

  - id: CORE-M04-03
    clause: M04
    title_zh: 同一任务的通道组相同
    title_en: Same channel set for each task
    phase: acquisition
    check: channels.same_set_per_task
    severity: warning
    verification: automatic

  - id: CORE-M04-04
    clause: M04
    title_zh: 通道数一致
    title_en: Channel count is consistent
    phase: acquisition
    check: channels.count_consistent
    severity: warning
    verification: automatic

  - id: CORE-M04-05
    clause: M04
    title_zh: 通道名在 10-20/10-10 范围内
    title_en: Channel name is within 10-20/10-10
    phase: acquisition
    check: channels.only_1005
    severity: info
    verification: automatic

  - id: CORE-M05-01
    clause: M05
    title_zh: 阻抗已记录
    title_en: Impedance is documented
    phase: acquisition
    check: impedance.documented
    severity: warning
    verification: automatic

  - id: CORE-M05-02
    clause: M05
    title_zh: 阻抗低于阈值（湿电极）
    title_en: Impedance below the limit (wet electrodes)
    phase: acquisition
    check: impedance.max
    params: {max_kohm: 5}
    severity: warning
    verification: automatic

  - id: CORE-M06-01
    clause: M06
    title_zh: 坏通道比例不超过阈值
    title_en: Share of bad channels within the limit
    phase: acquisition
    check: quality.bad_channels
    params: {max_fraction: 0.30625}  # 95th percentile, public corpus (A-20, MET-01): rulepacks/calibration/core.json, n = 22 recordings
    severity: warning
    verification: automatic

  - id: CORE-M07-01
    clause: M07
    title_zh: 工频干扰比不超过阈值
    title_en: Line-noise ratio within the limit
    phase: acquisition
    check: quality.line_noise
    params: {max_ratio: 0.407669}  # 95th percentile, public corpus (A-20, MET-01): rulepacks/calibration/core.json, n = 1050 channels
    severity: warning
    verification: automatic

  - id: CORE-M07-02
    clause: M07
    title_zh: 记录的工频与数据相符
    title_en: Documented line frequency fits the data
    phase: acquisition
    check: quality.line_frequency
    params: {min_factor: 2.0}
    severity: info
    verification: automatic

  - id: CORE-M08-01
    clause: M08
    title_zh: 平直段不超过时长的 5%
    title_en: Flat line within 5 % of the duration
    phase: acquisition
    check: quality.flatline
    params: {max_fraction: 0.05}
    severity: error
    verification: automatic

  - id: CORE-M08-02
    clause: M08
    title_zh: 削波不超过时长的 5%
    title_en: Clipping within 5 % of the duration
    phase: acquisition
    check: quality.clipping
    params: {max_fraction: 0.05}
    severity: error
    verification: automatic

  - id: CORE-M09-01
    clause: M09
    title_zh: autoreject 拒绝率不超过阈值
    title_en: autoreject rejection rate within the limit
    phase: acquisition
    check: quality.autoreject
    params: {max_fraction: 0.305083}  # 95th percentile, public corpus (A-20, MET-01): rulepacks/calibration/core.json, n = 22 recordings
    severity: warning
    verification: automatic

  - id: CORE-M09-02
    clause: M09
    title_zh: 非脑源 ICA 成分比例不超过阈值
    title_en: Share of non-brain ICA components within the limit
    phase: acquisition
    check: quality.non_brain_components
    params: {max_fraction: 0.6}  # 95th percentile, public corpus (A-20, MET-01): rulepacks/calibration/core.json, n = 22 recordings
    severity: warning
    verification: automatic

  # --- P4 ai ---
  - id: CORE-M11-01
    clause: M11
    title_zh: 每个类别不低于最小占比
    title_en: Every class at least the minimum share
    phase: processing
    check: ai.class_balance
    params: {min_share: 0.05}  # PRD start value, not calibrated (A-20); per split and overall (A-21)
    severity: warning
    verification: automatic

  - id: CORE-M11-02
    clause: M11
    title_zh: 年龄和性别已记录
    title_en: Age and sex documented
    phase: processing
    check: ai.demographics_complete
    severity: warning
    verification: automatic

  - id: CORE-M12-01
    clause: M12
    title_zh: 每名受试者只属于一个数据划分
    title_en: Each subject in exactly one split
    phase: processing
    check: ai.split_integrity
    severity: error
    verification: automatic

  - id: CORE-M12-02
    clause: M12
    title_zh: 无重复记录（信号哈希）
    title_en: No duplicate recordings (signal hash)
    phase: processing
    check: ai.duplicate_recordings
    severity: error
    verification: automatic

  # --- P4 provenance ---
  # M13 (A-22, A-82). CORE-M13-01 is a warning and an error in strict mode (--strict or [check] strict, PRD M13,
  # CLI-04); CORE-M13-02 is an error also without --strict (NG-F10, KONZEPT 2.2).
  - id: CORE-M13-01
    clause: M13
    title_zh: 来源清单存在
    title_en: Provenance manifest present
    phase: storage
    check: provenance.manifest_present
    severity: warning
    strict_severity: error
    verification: automatic

  - id: CORE-M13-02
    clause: M13
    title_zh: 文件与清单一致
    title_en: Files match the manifest
    phase: storage
    check: provenance.files_match
    severity: error
    verification: automatic

  - id: CORE-M13-03
    clause: M13
    title_zh: 已记录处理步骤和软件版本
    title_en: Processing steps and software versions documented
    phase: storage
    check: provenance.documented
    severity: warning
    verification: automatic

  # --- P4 annotation ---
  - id: CORE-M10-01
    clause: M10
    title_zh: 标注者间一致性（Cohen κ）不低于 0.6
    title_en: Agreement between annotators (Cohen's kappa) at least 0.6
    phase: annotation
    check: annotation.kappa
    params: {min_kappa: 0.6}  # PRD §12 M10: warning below 0.6 (common convention); mean of the pairwise kappas (A-80)
    severity: warning
    verification: automatic

  - id: CORE-M10-02
    clause: M10
    title_zh: 标注代码统一且在词表内
    title_en: Annotation codes uniform and in the vocabulary
    phase: annotation
    check: annotation.codes
    severity: warning
    verification: automatic

  - id: CORE-M10-03
    clause: M10
    title_zh: 连续标注无间隙
    title_en: No gaps in continuous annotation
    phase: annotation
    check: annotation.gaps
    severity: warning
    verification: automatic

  - id: CORE-M10-04
    clause: M10
    title_zh: 同一标注者的标注无重叠
    title_en: No overlapping annotations per annotator
    phase: annotation
    check: annotation.overlaps
    severity: warning
    verification: automatic
