light:
  red: "红"
  yellow: "黄"
  green: "绿"
  grey: "灰"
  legend: "红：至少一条错误级规则未通过，或错误级规则的证明材料待补。黄：警告级规则出现同样情况。绿：已加载规则包中没有未通过的错误级或警告级规则，错误级或警告级规则也没有待补的证明材料。灰：该阶段没有规则得出“通过”“未通过”“例外”或“证明材料待补”的结果（没有规则、只有占位规则，或只有不适用或无法检查的测量结果）。依据 evidence.yaml 评价的规则，其任何结果都计入，包括已说明理由的“不适用”。"

