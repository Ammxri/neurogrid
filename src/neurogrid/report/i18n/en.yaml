    bad_date: "Invalid date; expected YYYY-MM-DD."
  i18n:
    invalid_table: "Language table {language} is invalid."
    unknown_language: "Unknown language '{language}'. Available: zh, en."
    empty: "No language given. Available: zh, en."
  report:
    format_unavailable: "Output format '{format}' is not available in this version."
  pdf:
