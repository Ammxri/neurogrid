# NeuroGrid language table – English. Every key must exist in zh.yaml and de.yaml (tests/unit/test_i18n.py).
disclaimer: "Pre-check with NeuroGrid. Not a conformity assessment within the meaning of NMPA regulations."

cli:
  scan:
    title: "Inventory"
    bids: "BIDS dataset"
    "yes": "yes"
    "no": "no"
    formats: "Formats"
    recordings: "Recordings"
    unsupported: "Unsupported data files"
    orphans: "Data files that cannot be assigned"
    other: "Other files"
    links: "Links skipped (not followed)"
    subjects: "Subjects"
    subjects_unknown: "unknown (not every recording is mapped to a subject)"
    names_hint: "Hint: {count} data file path(s) contain non-ASCII letters or six or more digits in a row and may identify persons."
    unreadable: "Unreadable entries (not checked)"
    size: "Total size"
    written: "Inventory written to {path}"
  check:
    passes: "The dataset passes the checks of the loaded rule packs ({packs})."
    fails: "The dataset does not pass all checks of the loaded rule packs ({packs})."
    counts: "{errors} error(s), {warnings} warning(s)"
    written: "Results written to {path}"
    placeholder: "Placeholder rule packs are loaded. Their findings are not based on a norm text and do not count."
    none_evaluated: "No rule pack was evaluated: only placeholder rule packs are loaded ({packs})."
    open_evidence: "{count} open evidence item(s), counted in the errors and warnings above."
    recomputed: "Note: at least one helper process of --jobs stopped unexpectedly (for example out of memory); the work for {count} recording(s) is done without it."
    reconsent: "{count} subject(s) have a valid consent of a lower version than a risk of the risk register requires; re-consent may be required – the ethics committee decides (list per subject: results.json)."
  report:
    written: "Report written to {path}"
  convert:
    converted: "Converted recordings: {count}"
    skipped: "Not converted: {id} – {reason}"
    missing_field: "Not documented, written as n/a: {field} ({count} recording(s)); see M02 in 'check'."
    missing_field_na_valid: "Not documented, written as n/a: {field} ({count} recording(s)); BIDS accepts n/a for this field, so 'check' does not report it."
    missing_name: "Not documented, written as n/a: Name in dataset_description.json; set [dataset] name in neurogrid.toml."
    validator: "BIDS validator on the output: {errors} error(s), {warnings} warning(s)"
    written: "BIDS dataset written to {path}"
    nothing: "No recording was converted; no BIDS dataset was written."
    gbt_check: "GB/T 47127 structure check of the output: {errors} error(s), {warnings} warning(s); 'check --rulepack gbt47127' also compares the sidecars with the data."
    gbt_gap: "Not documented, left out: {field} ({count} file(s)); 'check --rulepack gbt47127' reports it."
    gbt_written: "GB/T 47127 data set written to {path}"
    gbt_nothing: "No recording was converted; no GB/T 47127 data set was written."
  error:
    prefix: "Error"
    internal: "Internal error ({type}). Run again with --debug for details."
    usage: "Invalid command line: {problem}"
    missing_option: "the option {name} is required (see '{command} --help')."
    missing_argument: "the argument {name} is missing (see '{command} --help')."
    no_such_option: "unknown option {name} (see '{command} --help')."
    bad_parameter: "invalid value for {name} (see '{command} --help')."
    option_needs_value: "the option {name} needs a value (see '{command} --help')."
    option_takes_no_value: "the option {name} takes no value (see '{command} --help')."
    no_such_command: "unknown command '{name}' (see 'neurogrid --help')."
    extra_arguments: "unexpected extra arguments: {arguments}."
    missing_command: "no command given (see 'neurogrid --help')."
    usage_generic: "the command line cannot be read ({type}; see '{command} --help')."
  warning:
    library: "Note: a library reported a warning ({type}); results are not affected."
  manifest:
    summary: "Manifest: {files} file(s), {size} MB"
    skipped: "Not hashed: {links} link(s) or junction(s) (not followed), {special} special file(s), {unsafe} name(s) the path check refuses, also everything inside such a folder (only their presence is compared)"
    hash: "Manifest hash: {hash}"
    written: "Manifest written to {path}"
    unreadable: "{count} file(s) or folder(s) cannot be read:"
    not_written: "No manifest was written: an incomplete manifest would not show later changes to these files."
    too_many_entries: "The dataset holds more files or entries that are not hashed than a manifest can list (limit {limit}); no manifest was written."
    bids_hint: "Note: the BIDS validator lists files that BIDS does not define, here the manifest file. Without --out the manifest is written to .neurogrid/manifest.json; the validator does not enter .neurogrid/. Otherwise write it outside the dataset or list it in .bidsignore."
    bids_hint_bidsignore: "Note: the BIDS validator lists files that BIDS does not define unless .bidsignore covers them, so it may list the manifest file. Without --out the manifest is written to .neurogrid/manifest.json; the validator does not enter .neurogrid/. Otherwise write it outside the dataset or list it in .bidsignore."
    more: "… and {count} more"
  verify:
    hash_ok: "Manifest hash {hash} matches the manifest content."
    hash_mismatch: "Manifest hash {hash} does not match the manifest content (the manifest was edited after it was written)."
    checked: "Files in the manifest: {files}"
    changed: "Changed: {count}"
    new: "New: {count}"
    missing: "Missing: {count}"
    skipped_changed: "Links or special files changed: {count}"
    unreadable: "Cannot be read now: {count}"
    matches: "The dataset matches the manifest."
    differs: "The dataset differs from the manifest."
  diff:
    title: "Comparison of two check runs (version comparison)"
    run:
      old: "Old run: NeuroGrid {version}, reference date {as_of}, rule packs {packs}"
      new: "New run: NeuroGrid {version}, reference date {as_of}, rule packs {packs}"
    config_changed: "The effective configuration differs between the runs (configuration hash)."
    config_unchanged: "The effective configuration is the same in both runs (configuration hash)."
    dataset_differs: "Warning: the two runs are of different datasets (dataset ID or name differ); a comparison is meaningful for runs of the same dataset."
    rules: "Rules only in the new run: {added}; only in the old run: {removed}"
    section:
      new: "New findings: {count}"
      fixed: "Fixed findings (the rule passes for the object now): {count}"
      removed: "Removed findings (rule not loaded or object no longer present): {count}"
      changed: "Changed findings: {count}"
      aggregated: "Rules on the consent records (counted only; no subject is listed):"
    line: "  - {rule} [{severity}] {object}: {status}; measured value: {value}"
    changed_line: "  - {rule} {object}: status {status}; severity {severity}; measured value {value}"
    more: "  … and {count} more (the JSON output lists all of them)"
    aggregated: "  - {rule}, {category}: {count}"
    summary: "Summary: {new} new, {fixed} fixed, {removed} removed, {changed} changed, {unchanged} unchanged; {placeholder} finding(s) of placeholder rule packs not compared."
    exit_new_errors: "Exit code 1: {count} error finding(s) of the new run were no error finding in the old run."
    exit_no_new_errors: "Exit code 0: the new run has no new error finding."
    written: "Comparison written to {path}"
  vault:
    role_looks_identifying: "Note: the role looks like a personal name or an identification number. Use a role name or initials; the access log records it as given."
    role_not_permitted: "Note: the role register roles.yaml does not permit this access ({reason}); the access event is recorded anyway. The register is advisory: NeuroGrid refuses nothing because of it."
    role_reason:
      role_unknown: "the role is not in the register"
      action_not_allowed: "the role may not perform this action"
      object_not_allowed: "an object is not covered by the object patterns of the role"
    roles_invalid: "Note: the role register roles.yaml cannot be read, so this access was not compared with it ('neurogrid check' names the problem); the access event is recorded anyway."
    consent:
      added: "Consent recorded: {subject}, version {version}."
      imported: "Consent records imported: {count}."
      subject_hint: "Note: {count} subject label(s) contain six or more digits in a row and may be identification numbers; use pseudonymous labels."
      date_in_future: "Note: {count} record(s) are dated after today; they take effect from their date on."
    role_missing: "Note: no role is set ([vault] role in neurogrid.toml, for check also --role); the access event of this run records no role."
    role_without_vault: "Note: --role has no effect: no vault was found (a single file has none), so this run writes no access event."
    event_not_written: "Warning: the access event of this run was not written to the vault ({reason}). The exit code is not affected."
    event_reason:
      no_vault: "there is no vault folder at the vault path any more"
      link: "a part of the vault path is a link or junction, which is not followed"
      log_missing: "the vault has no access log access.jsonl, and NeuroGrid never recreates it silently"
      locked: "another NeuroGrid process held the vault lock too long"
      not_writable: "the access log or the vault cannot be written"
      log_damaged: "the end of the access log holds no readable entry"
    export:
      part: "{file}: {size} bytes, SHA-256 {sha256}"
      head: "Head hash of the exported access log (the export event): {hash}"
      written: "Export package written to {path}"
      pia_unedited: "Warning: the impact assessment in pia/ is still the unedited template of 'neurogrid vault init'; it is exported as it is."
      roles_empty: "Warning: the role register roles.yaml lists no role; it is exported as it is."
      chain_broken: "Warning: the hash chain of the exported access log has {deviations} deviation(s); the log is exported as it is and index.json records its state. 'neurogrid vault verify' lists the deviations."
      inside_dataset: "Note: the export package lies inside the dataset. A manifest made later includes it, and a later verify reports it as new; write --out outside the dataset."
    init:
      created: "Created: {name}"
      kept: "Kept unchanged: {name}"
      manifest_hint: "consents.yaml, roles.yaml, risks.yaml, retention.yaml and the impact assessment pia/pia.zh.md and pia/pia.en.md are part of the manifest: run 'neurogrid manifest' again so that 'neurogrid verify' covers them. The access log and its lock file are left out of the manifest."
      templates_hint: "roles.yaml, risks.yaml and retention.yaml are empty registers with a commented example; pia/pia.zh.md and pia/pia.en.md are drafts of the impact assessment. Fill them in (NeuroVault page of the documentation); until then CORE-NV05-01 and CORE-NV05-02 report findings."
    log:
      written: "Access event {seq} recorded, hash {hash}"
      identifying: "Note: an object, the purpose or the approval reference looks like a personal name or an identification number; the access log records it as given. Use pseudonymous IDs and references without personal data."
    show:
      header: "Entries (line: #seq, time UTC | role | action | objects | purpose | approval reference):"
      row: "Line {line}: #{seq}, {time} | {role} | {action} | {objects} | {purpose} | {approval_ref}"
      none: "–"
      unreadable_line: "Line {line}: unreadable entry"
      more: "… and {count} earlier line(s), not shown (the newest 200 are shown)"
      empty: "The access log has no entries yet."
      summary_intact: "Hash chain: intact."
      summary_broken: "Hash chain: {deviations} deviation(s); 'neurogrid vault verify' lists them."
    verify:
      events: "Entries in the access log: {events}"
      head: "Head hash (last entry): {hash}"
      head_none: "Head hash: none (no readable entry)"
      deviation: "Line {line}: {kind}"
      deviation_likely: "Line {line}: {kind} (likely {likely})"
      deviation_no_line: "{kind}"
      expected_found: "Expected head {hash}: found in line {line}, {after} entry/entries after it."
      expected_missing: "Expected head {hash}: not part of the intact chain (the log was truncated at the end or rewritten)."
      intact: "The access log is intact."
      differs: "The access log has {deviations} deviation(s)."
      head_hint: "Record the head hash outside the vault (for example in the lab book) and check later with 'neurogrid vault verify --expect-head <hash>': only a head recorded elsewhere shows truncation at the end and rewriting."
      limits: "Limits: changing, inserting, deleting and reordering entries inside the chain are detected; an edit that recomputes all following hashes is a rewrite. Truncation at the end and complete rewriting are detected only with --expect-head against a head hash recorded elsewhere. Only accesses through NeuroGrid are recorded: runs that end with exit code 2 record nothing, scan, manifest and verify use only the vault at the default location, report records only with --config. Times come from the local clock and are not verified."
  help:
    app: "NeuroGrid – local, offline pre-check of EEG datasets. Not a conformity assessment."
    heading:
      usage: "Usage:"
      arguments: "Arguments:"
      options: "Options:"
      commands: "Commands:"
    metavar:
      options: "[OPTIONS]"
      command: "COMMAND [ARGS]..."
      value: "VALUE"
      number: "N"
    option:
      help: "Show this message and exit."
    default: "default: {value}"
    required: "required"
    global:
      lang: "Language of messages: zh or en (otherwise NEUROGRID_LANG, then the system language)."
      debug: "Show a sanitized traceback on internal errors."
    scan:
      about: "Inventory: formats, subjects, recordings, sizes, unsupported files."
      path: "Dataset folder or single data file."
      out: "Also write the inventory as JSON."
      show_paths: "Show real paths instead of pseudonymous IDs."
    check:
      about: "Check a dataset against rule packs and write results.json."
      path: "Dataset folder or single data file."
      rulepack: "Rule pack name or path (repeatable)."
      config: "Path to neurogrid.toml (default: .neurogrid/neurogrid.toml in the dataset)."
      out: "Results file."
      strict: "Strict mode (missing manifest is an error)."
      as_of: "Reference date YYYY-MM-DD (default: today)."
      allow_draft_rulepacks: "Allow placeholder rule packs (not based on a norm text)."
      show_paths: "Show real paths instead of pseudonymous IDs."
      jobs: "Processes for the signal metrics, 1 to 64 (results do not change)."
      evidence: "evidence.yaml with the evidence for manual rules (default: .neurogrid/evidence.yaml)."
      manifest: "Manifest to compare with (default: .neurogrid/manifest.json in the dataset)."
      role: "Role of this run's access event in the vault: a role name or initials (over [vault] role)."
    convert:
      about: "Convert a raw folder to EEG-BIDS or a raw or BIDS folder to GB/T 47127, and check the result."
      path: "Raw data folder or single data file."
      to: "Target structure: bids or gbt47127."
      out: "Output folder (must be empty or missing)."
      config: "Path to neurogrid.toml (default: .neurogrid/neurogrid.toml in the raw folder)."
      strip_identifying_headers: "Replace identifying header fields by placeholders."
    report:
      about: "Render the report for each language and format."
      results_file: "results.json written by 'check'."
      lang: "Report languages, e.g. zh,en (default: zh,en)."
      format: "Output formats, e.g. html,pdf (default: html); dossier writes dossier.pdf: an index with the zh and the en report in one PDF, whatever --lang says (needs the PDF browser)."
      out: "Output folder (default: next to results.json)."
      config: "neurogrid.toml whose vault the cover shows (access log entries, head hash, state); the report then records its access event there."
    manifest:
      about: "Write the provenance manifest: SHA-256 and size of every file, processing steps, software versions."
      path: "Dataset folder."
      out: "Manifest file (default: .neurogrid/manifest.json in the dataset folder)."
      show_paths: "Show real paths instead of pseudonymous IDs."
    verify:
      about: "Compare a dataset with its manifest: changed, new and missing files (exit 0 equal, 1 deviation)."
      path: "Dataset folder."
      manifest: "manifest.json written by 'manifest'."
      show_paths: "Show real paths instead of pseudonymous IDs."
    diff:
      about: "Compare two results.json files: new, fixed, removed and changed findings (exit 1 on new error findings)."
      old: "results.json of the earlier run."
      new: "results.json of the later run."
      format: "Output: text, json or text,json (default: text); json goes to stdout unless --out is given."
      out: "JSON file of the comparison (needed for text,json)."
    vault:
      about: "NeuroVault: consent records and the hash-chained access log of a dataset."
      consent:
        about: "Consent records in the vault (consents.yaml)."
        add:
          about: "Record the consent of a subject in the vault (consents.yaml), or import a table with --from; every change is recorded in the access log."
          path: "Dataset folder."
          subject: "Pseudonymous subject (label with or without 'sub-')."
          version: "Version of the consent (a whole number; a higher version replaces a lower one)."
          date: "Date of the consent or the withdrawal, YYYY-MM-DD."
          uses: "Permitted uses: training, validation, publication, sharing, commercial (repeatable or comma-separated)."
          withdrawn: "Full withdrawal from the date on (no use permitted)."
          ethics_ref: "Ethics approval reference (optional, no names)."
          from: "Import table consents.tsv (tab-separated), instead of the single fields."
          config: "Path to neurogrid.toml (default: .neurogrid/neurogrid.toml in the dataset); gives the vault path and the defaults of the event fields."
          role: "Role recorded in the access event (a role name or initials; default: [vault] role)."
          purpose: "Purpose recorded in the access event (default: [vault] purpose)."
          approval_ref: "Approval reference recorded in the access event (default: [vault] approval_ref)."
      export:
        about: "Write the export package for an inspection: a ZIP with the manifest, the access log, the role register, the impact assessment and the given reports, plus index.json; never signals or consent records. The access event export is recorded before packing."
        path: "Dataset folder (default: the current folder)."
        report: "A NeuroGrid report to include: report.<lang>.html, report.<lang>.pdf or dossier.pdf as 'neurogrid report' wrote it (repeatable, 1 to 5, each kind once)."
        out: "The ZIP file to write (outside the vault)."
        manifest: "Manifest to include (default: .neurogrid/manifest.json in the dataset)."
        show_paths: "Keep the real file names in the exported manifest (in raw folders the default is pseudonymous IDs)."
        config: "Path to neurogrid.toml (default: .neurogrid/neurogrid.toml in the dataset); [vault] path names the vault."
        role: "Role recorded in the access event (a role name or initials; default: [vault] role)."
        purpose: "Purpose recorded in the access event (default: [vault] purpose)."
        approval_ref: "Approval reference recorded in the access event (default: [vault] approval_ref)."
      init:
        about: "Create the missing parts of the vault: its folder, consents.yaml, the access log and its lock file, the role register roles.yaml, the risk register risks.yaml, the retention periods retention.yaml and the impact assessment templates pia/pia.zh.md and pia/pia.en.md; existing parts are kept."
        path: "Dataset folder (default: the current folder)."
        config: "Path to neurogrid.toml (default: .neurogrid/neurogrid.toml in the dataset); [vault] path names the vault."
      log:
        about: "Record an access in the access log by hand, or show the log with --show."
        path: "Dataset folder (default: the current folder)."
        config: "Path to neurogrid.toml (default: .neurogrid/neurogrid.toml in the dataset); [vault] path names the vault."
        action: "Action: read, check, convert, report, export or consent_manage."
        objects: "Object of the access: a dataset-relative path or pattern (repeatable; a comma is part of the path)."
        purpose: "Purpose of the access (default: [vault] purpose)."
        approval_ref: "Reference of the approval, e.g. of the ethics committee (default: [vault] approval_ref)."
        role: "Role name or initials (default: [vault] role)."
        show: "Show the newest entries, the number of entries, the head hash and the state of the chain; records nothing."
      verify:
        about: "Verify the hash chain of the access log (exit 0 intact, 1 deviation)."
        path: "Dataset folder (default: the current folder)."
        config: "Path to neurogrid.toml (default: .neurogrid/neurogrid.toml in the dataset); [vault] path names the vault."
        expect_head: "Head hash recorded earlier outside the vault; it must still be part of the chain (repeatable)."

errors:
  splits:
    columns: "splits.tsv needs exactly one column 'recording' and one column 'split' in its header."
    invalid_row: "splits.tsv, line {line}: the row has no value for 'recording' or 'split'."
    invalid_split: "splits.tsv, line {line}: the split must be train, val or test."
    unsafe_path: "splits.tsv, line {line}: the recording must be a relative path inside the dataset (no '..', drive, network or device paths) or a pseudonymous ID rec-xxxxxxxx."
    too_large: "splits.tsv is too large (limit {limit} bytes)."
    too_many_rows: "splits.tsv has too many rows (limit {limit})."
    encoding: "splits.tsv is not UTF-8 text (UTF-8 with or without BOM is accepted)."
    not_a_file: "The splits file is not a regular file."
    unreadable: "The splits file cannot be read."
    link: "The splits file is a link or lies behind one; links are not followed."
  yaml:
    alias: "YAML aliases are not allowed (line {line})."
    duplicate_key: "Duplicate key '{name}' (line {line})."
    syntax: "YAML syntax error (line {line})."
    too_large: "File is too large (limit {limit} bytes)."
    too_deep: "File is nested too deeply (limit {limit})."
  path:
    invalid: "Invalid path."
    absolute: "Only relative paths are allowed here."
    colon: "Paths with ':' (drives, data streams) are not allowed here."
    parent: "Paths with '..' are not allowed."
    trailing: "Path elements must not end with a space or a dot."
    reserved: "Reserved device names are not allowed in paths."
    link: "Links and junctions are not followed."
    outside: "The path leads outside the dataset."
    unc: "Network paths (UNC) are not allowed; NeuroGrid works offline."
    device: "Device and namespace paths (\\\\?\\, \\\\.\\, \\??\\) are not allowed."
  file:
    too_large: "File is too large (limit {limit} bytes)."
    encoding: "File is not UTF-8 text."
  rulepack:
    not_mapping: "A rule pack must be a YAML mapping."
    invalid: "Invalid rule pack: field '{field}' ({problem})."
    duplicate_rule: "Rule ID {rule} occurs more than once."
