    qa_failed: "The PDF did not pass NeuroGrid's PDF check ({checks}); no files were written."
    work_path_too_long: "The folder for the temporary files of the PDF browser has a path of {length} characters; on Windows the browser can use at most {limit}. No files were written."
    temp_unusable: "No working folder for the PDF browser could be created in the temporary folder of this computer; no files were written."
    temp_hint: "Set TEMP and TMP (and TMPDIR, if it is set) to an existing local folder with a path of at most {limit} characters and run the command again."
    temp_unusable_hint: "Set TEMP and TMP (Linux: TMPDIR) to an existing local folder you can write to and run the command again."
