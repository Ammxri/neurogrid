    unknown_check: "Rule {rule} uses the unknown check '{check}'."
    manual_needs_evidence: "Manual rule {rule} must use the check 'evidence.document'."
    unknown_param: "Rule {rule} sets the unknown parameter '{param}'."
    param_type: "Rule {rule}: parameter '{param}' has the wrong type."
    not_found: "Rule pack '{rulepack}' not found."
    placeholder_needs_flag: "Rule pack {rulepack} is a placeholder (not based on a norm text). Load it only with --allow-draft-rulepacks."
    encoding: "Rule pack is not UTF-8 text."
  config:
    splits_not_found: "Configuration: the file in field '{field}' does not exist."
    invalid: "Invalid configuration: field '{field}' ({problem})."
    syntax: "Configuration syntax error: {problem}."
    too_large: "Configuration file is too large."
    not_found: "Configuration file not found."
    unknown_param: "Configuration: rule {rule} has no parameter '{param}'."
    param_type: "Configuration: rule {rule}, parameter '{param}' has the wrong type."
    encoding: "Configuration file is not UTF-8 text (UTF-8 with or without BOM is accepted)."
    unsafe_path: "Configuration: field '{field}' must be a relative path inside the project (no '..', drive, network or device paths)."
    unsafe_pattern: "Configuration: the regular expression in field '{field}' can take extremely long on some file names (a repeated part contains another repetition or alternatives, or it uses a back-reference). Please simplify it."
    too_deep: "Configuration file is nested too deeply."
    duplicate_path: "Configuration: field '{field}' names the same file as an earlier row of [[annotation.files]]; each file may be assigned only once."
  evidence:
    invalid: "Invalid evidence file: field '{field}' ({problem})."
    not_mapping: "An evidence file must be a YAML mapping with format_version and evidence."
    encoding: "Evidence file is not UTF-8 text (UTF-8 with or without BOM is accepted)."
    too_large: "Evidence file is too large (limit {limit} bytes)."
    not_found: "Evidence file not found or not readable."
    unsafe_path: "Evidence for rule {rule}: the document must be a plain relative path (no '..', drive, network or device path, no URL)."
  input:
