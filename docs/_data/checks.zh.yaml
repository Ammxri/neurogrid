# 每个已注册检查项的测量对象；对自带比较规则的检查项另给出通过条件（tools/gen_docs.py，reference/checks.md）。
# 键 = 注册表中的检查项 ID；测试保证两者一致。中文，待母语人士审校（A-07）。
access.log_intact:
  object: "数据集：其 vault 访问日志（access.jsonl）的哈希链"
access.log_writable:
  object: "数据集：其 vault 的访问日志（以追加方式打开，不写入任何内容）"
ai.class_balance:
  object: "标签来源的每个范围（all、train、val、test）及每个类别"
  passes: "该类别在其范围内的占比不低于 `min_share`；对于类别已隐去的标签来源（存在少于 5 名受试者的单元格），只依据受试者人数本身可得出的信息判断（A-81）"
ai.demographics_complete:
  object: "数据集（participants.tsv）：每名受试者的年龄和性别"
ai.duplicate_recordings:
  object: "每条记录（信号哈希 NG-SIGHASH-v1，从不输出）"
  passes: "数据集中没有其他记录具有相同的信号哈希"
ai.split_integrity:
  object: "每名受试者"
  passes: "该受试者至多属于一个数据划分"
annotation.codes:
  object: "标注中的每个代码或标签"
annotation.gaps:
  object: "每条带标注的记录（连续模式）"
  passes: "标注之间没有空隙"
annotation.kappa:
  object: "每条至少有两名标注者的记录"
annotation.overlaps:
  object: "每条记录及每名标注者"
  passes: "该标注者的标注互不重叠"
bids.hed_schema_available:
