bids.validator_warnings:
  object: "BIDS 验证器报告的每个文件，按验证器代码"
channels.count_consistent:
  object: "每条记录"
  passes: "附属元数据文件、channels.tsv 和数据文件中的 EEG 通道数一致，channels.tsv 与数据文件中的通道总数也一致"
channels.only_1005:
  object: "记录中的每个 EEG 通道"
channels.positions:
