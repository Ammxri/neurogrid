# Labels of the generated documentation pages (tools/gen_docs.py), English. Not part of the site.
checks:
  title: "Check registry"
  intro: >-
    Every check a rule pack may name in `check`, generated from the registry of this NeuroGrid version
    (`neurogrid.checks.registry`). A rule pack uses only registered checks and only their declared parameters
    (A-13); a parameter value comes from `neurogrid.toml` (`[rules."ID".params]`), else from the rule pack, else
    from the default below.
  title_row: "Title"
  params: "Parameters"
  passes: "Passes when"
  object: "Measured on"
  rules: "Built-in rules"
  none: "–"
  kind: "{name} ({kind}, default {default})"
  bound_max: "measured value ≤ `{param}`"
  bound_min: "measured value ≥ `{param}`"
  is_true: "no deviation found"
  evidence: "the evidence in evidence.yaml is filed (status provided or a justified not_applicable)"
rules:
