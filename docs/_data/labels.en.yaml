# Labels of the generated documentation pages (tools/gen_docs.py), English. Not part of the site.
checks:
  title: "Check registry"
  intro: >-
    Every check a rule pack may name in `check`, generated from the registry of this NeuroGrid version
    (`neurogrid.checks.registry`). A rule pack uses only registered checks and only their declared parameters
    (A-13); a parameter value comes from `neurogrid.toml` (`[rules."ID".params]`), else from the rule pack, else
    from the default below.
  title_row: "Title"
  params: "Parameters"
  passes: "Passes when"
  object: "Measured on"
  rules: "Built-in rules"
  none: "–"
  kind: "{name} ({kind}, default {default})"
  bound_max: "measured value ≤ `{param}`"
  bound_min: "measured value ≥ `{param}`"
  is_true: "no deviation found"
  evidence: "the evidence in evidence.yaml is filed (status provided or a justified not_applicable)"
rules:
  title: "Built-in rules"
  intro: >-
    The rules of the built-in rule packs of this NeuroGrid version, generated from the packs themselves. The
    SHA-256 is taken over the file bytes, as in results.json (`rulepacks[].sha256`).
  pack: "Rule pack"
  version: "Version"
  source: "Source"
  source_status: "Source status"
  norm: "Maps a norm (coverage measure)"
  sha256: "SHA-256"
  title_row: "Title"
  clause: "Clause"
  phase: "Phase"
  check: "Check"
  params: "Parameters"
  severity: "Severity"
  strict_severity: "Severity with --strict"
  verification: "Verification"
  "yes": "yes"
  "no": "no"
  none: "–"
  default_param: "{name} = {value} (check default)"
  pack_param: "{name} = {value} (rule pack)"
  placeholder_suffix: " (placeholder)"
thresholds:
  rule: "Rule"
  severity: "Severity"
  params: "Parameter"
  origin: "Origin"
  none: "–"
  origin_spec: "start value of the product specification"
  origin_spec_second_hand: "start value of the product specification, which quotes T/GXDSL 008-2025 (second-hand)"
  origin_with_ref: "{origin} ({ref})"
  origin_assumption: "assumption {ref} (decision log)"
  origin_calibrated: "calibrated: 95th percentile over {n} {over} of the public corpus ({ref})"
  over_recordings: "recordings"
  over_channels: "channels"
calibration:
  dataset: "Data set"
  version: "Version"
  doi: "DOI"
  format: "Format"
  recordings: "Recordings"
  channels: "Channels (M07)"
questions:
  title: "Interpretation questions"
  intro: >-
    Clauses that can be read in more than one way, with the possible readings, the reading NeuroGrid implements
    and whom the question was put to (by role, never by name). The list is generated from
    `docs/_data/interpretation_questions.yaml`; it names no pack of its own, so every rule pack that maps a
    norm uses it.
  empty: >-
    No interpretation questions are recorded yet. Entries are added when a norm text is turned into rules;
    each one names the clause, the possible readings, the reading NeuroGrid implements and whom it was asked
    (by role).
  id: "ID"
  rulepack: "Rule pack"
  clause: "Clause"
  rules: "Rules"
  topic: "Topic"
  question: "Question"
  readings: "Possible readings"
  chosen: "Reading implemented"
  status: "Status"
  asked: "Asked (role, date)"
  answer: "Answer"
  effect: "Effect on the rules"
  status_open: "open"
  status_asked: "asked"
  status_answered: "answered"
  status_withdrawn: "withdrawn"
  role_author: "author of the standard"
  role_test_institute: "test institute"
  role_regulator: "regulator"
  role_other: "other"
  effect_none: "no change"
  effect_params: "parameters changed"
  effect_rule_text: "rule title or description changed"
  effect_new_rule: "new rule"
  effect_removed_rule: "rule removed"
