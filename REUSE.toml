version = 1

# Licence of every path (TECH-10, A-27, A-86). When several tables match a file, the last one wins; the test
# tests/docs/test_licensing.py applies the same rule to every tracked file. Licence texts are in LICENSES/.
# LICENSES/CC-BY-4.0.txt is the CC BY 4.0 legal code as downloaded under D-15; its source and SHA-256 are in
# license-gate/licence_texts.toml. LICENSES/ holds only licences of this repository's own files, as reuse
# lint requires (no unused licence). The LGPL-3.0 and GPL-3.0 texts of the D-16 exception license no file
# of this repository: they belong to the LGPL part of the bundled BIDS validator and are kept as licence
# files next to isomorphic-git 1.41.9 in license-gate/third_party/bids-validator-3.0.2/ (its manifest
# attaches them), like the other third-party licence texts there.

# Documentation (CC BY 4.0)
[[annotations]]
path = ["docs/**", "README.md", "DATA_SOURCES.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Ahad"
SPDX-License-Identifier = "CC-BY-4.0"

# Code, tooling and configuration (Apache-2.0); the site's CSS and JavaScript are code as well
[[annotations]]
path = [
    "src/**",
    "tests/*.py",
    "tests/**/*.py",
    "tests/fixtures/*.toml",
    "tools/**",
    ".github/**",
    "pyproject.toml",
    "uv.lock",
    ".gitattributes",
    ".gitignore",
    ".python-version",
    "REUSE.toml",
    "NOTICE",
    "license-gate/**",
    "packaging/**",
    ".env.example",
    "mkdocs.yml",
    "docs/assets/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Ahad"
SPDX-License-Identifier = "Apache-2.0"

# Third-party notices: NeuroGrid's own prose is CC BY 4.0; the licence texts, notices and headers it
# reproduces word for word keep their own terms and authors (LICENSES/LicenseRef-NeuroGrid-Reproduced-
# Notices.txt; the GPL and LGPL texts may be copied only unchanged)
[[annotations]]
path = ["THIRD_PARTY_NOTICES.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Ammar Ahad", "The third-party copyright holders named in this file"]
SPDX-License-Identifier = "CC-BY-4.0 AND LicenseRef-NeuroGrid-Reproduced-Notices"

# Sample data (CC BY 4.0)
[[annotations]]
path = ["tests/fixtures/synthetic/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Ahad"
SPDX-License-Identifier = "CC-BY-4.0"

# Report fonts: Noto Sans SC static cuts and their licence (OFL-1.1, A-27)
[[annotations]]
path = ["src/neurogrid/report/fonts/*.ttf", "src/neurogrid/report/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2021 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"

# The provenance record of the fonts is NeuroGrid's own data (Apache-2.0)
[[annotations]]
path = ["src/neurogrid/report/fonts/fonts.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ammar Ahad"
SPDX-License-Identifier = "Apache-2.0"
